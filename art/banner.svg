<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Laravel Slack Errors" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#fff4ef"/>
      <stop offset="55%" stop-color="#fdeef4"/>
      <stop offset="100%" stop-color="#f1ebff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2a1033" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fb7185" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c2d52" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="1180" cy="40" r="170" fill="#c4b5fd" opacity="0.22"/>
  <circle cx="60" cy="300" r="150" fill="#fdba74" opacity="0.18"/>

  <!-- heartbeat line: calm waves, then the exception spike -->
  <path d="M0 268 H120 q12 -14 24 0 H170 l8 10 l10 -34 l10 40 l8 -16 H360 q12 -14 24 0 H560 q12 -12 24 0 H820 l14 14 l22 -184 l24 202 l16 -32 H968"
        fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="856" cy="98" r="34" fill="url(#halo)"/>
  <circle cx="856" cy="98" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="3"/>

  <!-- text -->
  <g transform="translate(96 0)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="50" width="128" height="28" rx="14" fill="#2a1033"/>
    <text x="64" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#fecdd3" letter-spacing="2.4">FOR LARAVEL</text>

    <text x="-4" y="152" font-size="84" font-weight="800" fill="#2a1033" letter-spacing="-3">Slack Errors</text>

    <text x="0" y="192" font-size="22" fill="#7a5a83">Every reported exception, straight to your Slack channel.</text>

    <g transform="translate(0 212)">
      <rect x="0" y="0" width="470" height="36" rx="10" fill="#ffffff" fill-opacity="0.75" stroke="#2a1033" stroke-opacity="0.10"/>
      <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#2a1033"><tspan fill="#e11d48" font-weight="700">$</tspan> composer require marekmiklusek/laravel-slack-errors</text>
    </g>
  </g>

  <!-- notification the spike lands in -->
  <g transform="translate(968 236)" filter="url(#soft)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="236" height="64" rx="18" fill="#ffffff"/>
    <rect x="12" y="12" width="40" height="40" rx="11" fill="#2a1033"/>
    <text x="32" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#fda4af">#</text>
    <text x="66" y="29" font-size="17" font-weight="800" fill="#2a1033">errors</text>
    <text x="66" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#9b7aa3">RuntimeException · now</text>
    <circle cx="228" cy="8" r="13" fill="#e11d48" stroke="#ffffff" stroke-width="3"/>
    <text x="228" y="13" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
  </g>
</svg>
